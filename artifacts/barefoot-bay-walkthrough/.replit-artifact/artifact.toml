kind = "slides"
previewPath = "/barefoot-bay-walkthrough/"
title = "Discover Barefoot Bay — Walkthrough"
version = "1.0.0"
id = "artifacts/barefoot-bay-walkthrough"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/barefoot-bay-walkthrough/" ]
localPort = 6800

[services.development]
run = "pnpm --filter @workspace/barefoot-bay-walkthrough run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/barefoot-bay-walkthrough", "run", "build" ]
publicDir = "artifacts/barefoot-bay-walkthrough/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "6800"
BASE_PATH = "/barefoot-bay-walkthrough/"
