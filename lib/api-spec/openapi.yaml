openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /vendors/directory:
    get:
      operationId: getVendorDirectory
      summary: Viewer-visible vendor card summaries without CMS detail HTML
      description: Guests may read published summaries only when the configured Vendors guest feature is enabled. Signed-in visibility remains viewer-scoped.
      parameters:
        - in: query
          name: includeHidden
          schema: { type: boolean, default: false }
          description: Only honored for an authenticated administrator.
      responses:
        '200':
          description: Private directory; no badge or other-account data.
          content:
            application/json:
              schema:
                type: object
                required: [vendors, categories]
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      required: [slug, label]
                      properties:
                        slug: { type: string }
                        label: { type: string }
                  vendors:
                    type: array
                    items:
                      type: object
                      required: [slug, title, description, image, href, categorySlug, categoryLabel, isHidden, createdAt, showInDirectory, showInCategory]
                      properties:
                        slug: { type: string }
                        title: { type: string }
                        description: { type: string, maxLength: 220 }
                        image: { type: [string, 'null'] }
                        href: { type: string }
                        categorySlug: { type: string }
                        categoryLabel: { type: string }
                        showInDirectory: { type: boolean, description: Preserved main-directory membership. }
                        showInCategory: { type: boolean, description: Preserved category-page membership. }
                        isHidden: { type: boolean }
                        createdAt: { type: [string, 'null'] }
                        contentVisibility:
                          type: object
                          properties:
                            removed: { type: boolean }
                            status: { type: string }
        '401': { description: Sign-in required because guest Vendors access is disabled }
        '400': { description: Invalid includeHidden parameter }
        '500': { description: Directory unavailable; retry is safe }
  /pages/navigation:
    get:
      operationId: getPageNavigation
      summary: CMS menu metadata without full HTML or vendor details
      parameters:
        - in: query
          name: includeHidden
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Viewer-visible page menu entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, slug, title, isHidden]
                  properties:
                    id: { type: integer }
                    slug: { type: string }
                    title: { type: string }
                    category: { type: [string, 'null'] }
                    order: { type: [integer, 'null'] }
                    isHidden: { type: boolean }
        '500': { description: Navigation unavailable }
  /events/month-previews:
    get:
      operationId: getCalendarMonthPreviews
      summary: Up to three viewer-visible previews and a filtered count per local start-day
      description: Private, bounded summary. Full selected-day cards use the existing events endpoint.
      parameters:
        - { in: query, name: start, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: end, required: true, schema: { type: string, format: date-time }, description: Exclusive end; window must be positive and at most 93 days. }
        - { in: query, name: timeZone, required: true, schema: { type: string, maxLength: 100 }, description: Browser IANA time zone. }
        - { in: query, name: category, schema: { type: string, enum: [all, entertainment, government, social, promotional, bulletin, platinum_sponsor, other], default: all } }
        - { in: query, name: badge, schema: { type: boolean } }
        - { in: query, name: search, schema: { type: string, maxLength: 200 } }
        - { in: query, name: order, schema: { type: string, enum: [asc, desc, now], default: now } }
      responses:
        '200':
          description: Authorized counts and lightweight previews; no full descriptions or media.
          content:
            application/json:
              schema:
                type: object
                required: [days]
                properties:
                  days:
                    type: object
                    additionalProperties:
                      type: object
                      required: [total, previews]
                      properties:
                        total: { type: integer, minimum: 1 }
                        previews:
                          type: array
                          maxItems: 3
                          items:
                            type: object
                            required: [id, title, category, startDate, endDate, badgeRequired]
                            properties:
                              id: { type: integer }
                              title: { type: string }
                              category: { type: string }
                              startDate: { type: string, format: date-time }
                              endDate: { type: string, format: date-time }
                              badgeRequired: { type: [boolean, 'null'] }
                              contentVisibility:
                                type: object
                                properties:
                                  removed: { type: boolean }
                                  status: { type: string }
                                  dmcaCaseId: { type: [integer, 'null'] }
                                  hiddenAt: { type: [string, 'null'] }
                                  reason: { type: [string, 'null'] }
                                  legalHold: { type: boolean }
        '400':
          description: Invalid window, timezone or filters.
        '500':
          description: Summary unavailable; never returned as an empty calendar.
  /messages:
    post:
      operationId: submitMessage
      summary: Create an in-site message and durably enqueue optional email
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 16, maxLength: 100 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MessageSubmission"
      responses:
        "201":
          description: In-site message created; email is not yet guaranteed accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSubmissionResult"
        "400": { description: Invalid submission or idempotency key }
        "401": { description: Authentication required }
        "403": { description: Unauthorized recipient targeting }
        "409": { description: Key reused with different content or original submission still uncertain; do not resend with a new key }
        "500": { description: Creation or email setup failed; inspect saved progress before retrying }
  /messages/{id}/reply:
    post:
      operationId: submitMessageReply
      summary: Create a reply with the same durable submission and email semantics
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 16, maxLength: 100 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MessageSubmission"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSubmissionResult"
        "400": { description: Invalid submission }
        "401": { description: Authentication required }
        "403": { description: Not authorized to reply }
        "404": { description: Parent message missing }
        "409": { description: Changed or uncertain duplicate submission }
        "500": { description: Creation or email setup failed; inspect saved progress }
  /messages/send-progress:
    get:
      operationId: listMessageSendProgress
      summary: Authenticated sender's last 20 durable submission outcomes, without recipient addresses
      responses:
        "200":
          description: Counts reflect provider acceptance, not inbox delivery. Unknown attempts are never automatically retried.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      required: [id, messageId, state, createdAt, emailRequested, total, queued, attempted, accepted, failed, skipped, unknown]
                      properties:
                        id: { type: string }
                        messageId: { type: [integer, "null"] }
                        state: { type: string }
                        createdAt: { type: string, format: date-time }
                        emailRequested: { type: boolean }
                        total: { type: integer }
                        queued: { type: integer }
                        attempted: { type: integer }
                        accepted: { type: integer }
                        failed: { type: integer }
                        skipped: { type: integer }
                        unknown: { type: integer }
        "401":
          description: Authentication required
  /messages/send-progress/{id}:
    delete:
      operationId: dismissMessageSendProgress
      summary: Admin sender dismisses a recent send progress entry without changing its send state
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Entry dismissed; request, attempts, and message are preserved
        "400":
          description: Invalid send progress ID
        "401":
          description: Authentication required
        "403":
          description: Administrator permission required
        "404":
          description: Entry is missing, expired, already dismissed, or not owned by this sender
  /legal/history:
    get:
      operationId: getLegalHistory
      summary: Authorized publication and acceptance history
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: policyKey
          schema: { type: string, enum: [terms, privacy, dmca] }
      responses:
        "200":
          description: Independently paginated publications and acceptances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalHistory"
        "403":
          description: Administrator permission required
        "428":
          description: Current policy acceptance required
  /legal/policies:
    get:
      operationId: getLegalPolicies
      summary: Read current immutable legal publications
      responses:
        "200":
          description: Current publications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalPolicyManifest"
        "503":
          description: Publications temporarily unavailable
  /legal/consent:
    get:
      operationId: getLegalConsent
      summary: Read current account acceptance requirements
      responses:
        "200":
          description: Current consent status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalConsentStatus"
        "401":
          description: Sign in required
        "503":
          description: Consent store unavailable; account access remains blocked
    post:
      operationId: acceptLegalPolicies
      summary: Explicitly accept exact current policy versions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalConsentInput"
      responses:
        "200":
          description: Durable acceptance recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalConsentStatus"
        "400":
          description: Missing explicit acceptance
        "401":
          description: Sign in required
        "409":
          description: Policy version changed; review again
        "503":
          description: Consent store unavailable; no access granted
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    MessageSubmission:
      type: object
      required: [content]
      properties:
        recipient: { type: string }
        subject: { type: string }
        content: { type: string, minLength: 1 }
        templateId: { type: string }
        inReplyTo: { type: string }
        sendEmail: { type: string, enum: ["true", "false"] }
        attachments:
          type: array
          description: Multipart file parts, handled by the upload middleware separately from text fields
          items: { type: string, format: binary }
    MessageSubmissionResult:
      type: object
      required: [message, success]
      properties:
        success: { type: boolean }
        message:
          type: object
          additionalProperties: true
          required: [id, subject, content, senderId]
          properties:
            id: { type: integer }
            subject: { type: string }
            content: { type: string }
            senderId: { type: integer }
    LegalAcceptanceRecord:
      type: object
      required: [userId, policyKey, versionId, acceptedAt, source]
      properties:
        userId: { type: integer }
        policyKey: { type: string, enum: [terms, privacy, dmca] }
        versionId: { type: integer }
        acceptedAt: { type: string, format: date-time }
        source: { type: string, enum: [signup, subsequent] }
    LegalHistory:
      type: object
      required: [versions, acceptances, page, pageSize, total, versionTotal, acceptanceTotal]
      properties:
        versions:
          type: array
          items: { $ref: "#/components/schemas/LegalPolicy" }
        acceptances:
          type: array
          items: { $ref: "#/components/schemas/LegalAcceptanceRecord" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        versionTotal: { type: integer }
        acceptanceTotal: { type: integer }
    LegalPolicy:
      type: object
      required: [key, versionId, title, url, publishedAt, contentHtml, changeNotes]
      properties:
        key:
          type: string
          enum: [terms, privacy, dmca]
        versionId:
          type: integer
        title:
          type: string
        url:
          type: string
        publishedAt:
          type: string
          format: date-time
        contentHtml:
          type: string
        changeNotes:
          type: [string, "null"]
    LegalPolicyManifest:
      type: object
      required: [policies]
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/LegalPolicy"
    LegalConsentStatus:
      type: object
      required: [policies, outstanding, requiresAcceptance]
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/LegalPolicy"
        outstanding:
          type: array
          items:
            $ref: "#/components/schemas/LegalPolicy"
        requiresAcceptance:
          type: boolean
    LegalAcceptance:
      type: object
      required: [key, versionId, accepted]
      properties:
        key:
          type: string
          enum: [terms, privacy, dmca]
        versionId:
          type: integer
          minimum: 1
        accepted:
          type: boolean
          enum: [true]
    LegalConsentInput:
      type: object
      required: [acceptances]
      properties:
        acceptances:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/LegalAcceptance"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

