<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#4A5568"/>
  
  <!-- Boy reading a book -->
  <g transform="translate(100, 100)">
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="#F7E6CC"/>
    
    <!-- Hair -->
    <path d="M -22 -35 Q 0 -45 22 -35 Q 20 -20 0 -20 Q -20 -20 -22 -35" fill="#8B4513"/>
    
    <!-- Eyes -->
    <circle cx="-8" cy="-25" r="2" fill="#000"/>
    <circle cx="8" cy="-25" r="2" fill="#000"/>
    
    <!-- Nose -->
    <circle cx="0" cy="-20" r="1" fill="#E8C5A0"/>
    
    <!-- Mouth (slight smile) -->
    <path d="M -5 -15 Q 0 -12 5 -15" stroke="#000" stroke-width="1" fill="none"/>
    
    <!-- Body -->
    <rect x="-15" y="5" width="30" height="40" rx="5" fill="#3182CE"/>
    
    <!-- Arms -->
    <rect x="-25" y="10" width="10" height="25" rx="5" fill="#F7E6CC"/>
    <rect x="15" y="10" width="10" height="25" rx="5" fill="#F7E6CC"/>
    
    <!-- Book -->
    <rect x="-12" y="20" width="24" height="18" rx="2" fill="#E53E3E"/>
    <rect x="-12" y="20" width="12" height="18" rx="2" fill="#C53030"/>
    <line x1="0" y1="20" x2="0" y2="38" stroke="#000" stroke-width="1"/>
    
    <!-- Book pages -->
    <rect x="-10" y="22" width="8" height="14" fill="#FFF"/>
    <rect x="2" y="22" width="8" height="14" fill="#FFF"/>
    
    <!-- Reading lines on pages -->
    <line x1="-8" y1="25" x2="-4" y2="25" stroke="#000" stroke-width="0.5"/>
    <line x1="-8" y1="27" x2="-4" y2="27" stroke="#000" stroke-width="0.5"/>
    <line x1="-8" y1="29" x2="-4" y2="29" stroke="#000" stroke-width="0.5"/>
    <line x1="4" y1="25" x2="8" y2="25" stroke="#000" stroke-width="0.5"/>
    <line x1="4" y1="27" x2="8" y2="27" stroke="#000" stroke-width="0.5"/>
    <line x1="4" y1="29" x2="8" y2="29" stroke="#000" stroke-width="0.5"/>
  </g>
  
  <!-- Text at bottom -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFF">Young Reader</text>
</svg>