<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Post Test</title>
</head>
<body>
    <h1>Forum Post Test</h1>
    <p>Testing forum post page access without React compilation issues.</p>
    
    <script>
        // Simple test to check if we can access the forum post API
        fetch('/api/forum/posts/198')
            .then(response => response.json())
            .then(data => {
                console.log('Forum post data:', data);
                document.body.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            })
            .catch(error => {
                console.error('Error:', error);
                document.body.innerHTML += '<p>Error: ' + error.message + '</p>';
            });
    </script>
</body>
</html>
